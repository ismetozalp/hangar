<!-- Repository password prompt.
     Opened by the WRONG_PASSWORD remediation and by repository creation. The value
     is handed straight to core/secrets.js, which is the only module allowed to put
     it on disk — it is never stored in Alpine state beyond this dialog's lifetime. -->
<div class="modal fade" id="hangar-password" tabindex="-1"
     aria-labelledby="hangar-password-title" aria-hidden="true"
     x-data="hangarPassword()" x-init="init()">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form @submit.prevent="submit()">

                <div class="modal-header">
                    <h5 class="modal-title" id="hangar-password-title" x-text="title"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    <p class="small text-secondary" x-show="repoLabel">
                        Repository: <span class="hangar-mono" x-text="repoLabel"></span>
                    </p>

                    <div class="mb-3">
                        <label class="form-label" for="hangar-password-input">Password</label>
                        <input id="hangar-password-input" class="form-control"
                               :type="reveal ? 'text' : 'password'"
                               x-model="password" autocomplete="off" spellcheck="false"
                               :aria-invalid="!!error">
                    </div>

                    <!-- Confirmation only when creating a repository: a typo in a new
                         repository password is unrecoverable, because there is no
                         existing repository to check it against. -->
                    <div class="mb-3" x-show="confirming">
                        <label class="form-label" for="hangar-password-confirm">Confirm password</label>
                        <input id="hangar-password-confirm" class="form-control"
                               :type="reveal ? 'text' : 'password'"
                               x-model="confirm" autocomplete="off" spellcheck="false">
                    </div>

                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="hangar-password-reveal"
                               x-model="reveal">
                        <label class="form-check-label small" for="hangar-password-reveal">
                            Show password
                        </label>
                    </div>

                    <div x-show="confirming" class="alert alert-warning py-2 px-3 small mb-0">
                        Store this password somewhere safe. A restic repository cannot be
                        decrypted without it, and there is no recovery mechanism.
                    </div>

                    <div x-show="error" class="alert alert-danger py-2 px-3 small mb-0 mt-2"
                         x-text="error"></div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" :disabled="!valid()">Continue</button>
                </div>

            </form>
        </div>
    </div>
</div>
